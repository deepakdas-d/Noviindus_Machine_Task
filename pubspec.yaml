name: noviindus
description: "A new Flutter project."

publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_dotenv: ^6.0.0
  provider: ^6.1.5+1
  http: ^1.5.0
  shared_preferences: ^2.5.3
  shimmer: ^3.0.0
  video_player: ^2.10.0
  chewie: ^1.13.0
  dio: ^5.9.0
  image_picker: ^1.2.0
  permission_handler: ^12.0.1
  path: ^1.9.1
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/
    - assets/icons/

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.jpg"
  remove_alpha_ios: true
